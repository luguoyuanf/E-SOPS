server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    resolver 127.0.0.11 valid=10s;
    location /api/ {
        # Platform applies the tenant's configured file-size and storage limits.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(zh-CN|en-US|zh-TW|th-TH|vi-VN|fr-FR|de-DE|ru-RU)(/|$) {
        try_files $uri $uri.html $uri/index.html =404;
    }
    location = / { add_header Cache-Control "no-store"; try_files /public-home.html =404; }
    location = /downloads { try_files /downloads.html =404; }
    location = /plans { try_files /plans.html =404; }
    location = /sitemap { try_files /sitemap.html =404; }
    location = /guides/get-started { try_files /guides/get-started.html =404; }
    location = /manual { try_files /manual.html =404; }
    location = /manual/ { return 301 /manual; }
    location /manual/ { try_files $uri $uri.html =404; }
    location = /privacy { add_header Cache-Control "no-store"; try_files /privacy.html =404; }
    location = /terms { add_header Cache-Control "no-store"; try_files /terms.html =404; }
    location ~ ^/_app-config.*\.js$ { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /web-release.json { add_header Cache-Control "no-store"; try_files $uri =404; }
    # Vite fingerprints these filenames; new releases use new URLs.
    location ~* "^/(js|jse|css|png|woff2|assets)/.+-[A-Za-z0-9_-]{8,}\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
